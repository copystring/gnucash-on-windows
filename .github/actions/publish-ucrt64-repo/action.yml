name: Publish to ucrt64 rolling repo
description: >-
  Merges newly built ucrt64 package(s) into the shared gnc-ucrt64-repo
  rolling GitHub release, hosted in a separate repo from the one this action
  runs in, without disturbing packages published by other workflows. Must
  run after msys2/setup-msys2 in a job whose default shell is `msys2 {0}`,
  and the caller's workflow must set a shared `concurrency: group:` (the
  same one across all callers) so two publishes never race on the same
  release. Requires a GitHub App installed on deps-repo with Contents:
  read/write; the caller must pass its client ID and private key in as
  app-client-id/app-private-key (a composite action's own manifest has no
  access to the vars/secrets contexts -- only inputs/github/env -- so these
  can't be read directly here and must be threaded through from the calling
  workflow, which does have access to them). The default GITHUB_TOKEN can
  never be used here instead, since it is strictly scoped to the repo the
  workflow runs in and cannot write to a different repo even within the
  same org.

inputs:
  package-dir:
    description: Directory containing the newly built .pkg.tar.zst file(s)
    required: true
  app-client-id:
    description: Client ID of the GitHub App installed on deps-repo.
    required: true
  app-private-key:
    description: Private key of the GitHub App installed on deps-repo.
    required: true
  deps-repo-owner:
    description: Owner of the repo hosting the rolling release.
    required: false
    default: Gnucash
  deps-repo-name:
    description: >-
      Name (no owner) of the repo hosting the rolling release. Deliberately
      a separate repo from the one this action runs in:
      gnucash/gnucash-on-windows is a mirror of code.gnucash.org, and any
      ref not present upstream -- including a tag created only via the
      GitHub API, anchoring this release -- gets pruned when the mirror
      syncs, silently reverting the release to an unpublished, untagged
      state hours later with no error.
    required: false
    default: gnucash-windows-deps-repo
  release-tag:
    description: Tag of the shared rolling release to update
    required: false
    default: gnc-ucrt64-repo
  target-branch:
    description: >-
      Branch (in deps-repo) to create the release tag against. Must be
      deps-repo's actual default branch (see note below).
    required: false
    default: future

runs:
  using: composite
  steps:
    - name: Generate deps-repo installation token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.deps-repo-owner }}
        repositories: ${{ inputs.deps-repo-name }}

    - name: Fetch current repo database, if any
      shell: pwsh
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        & "$env:GITHUB_ACTION_PATH/fetch-ucrt64-repo-assets.ps1" `
          -PackageDir '${{ inputs.package-dir }}' `
          -Owner '${{ inputs.deps-repo-owner }}' `
          -Repository '${{ inputs.deps-repo-name }}' `
          -ReleaseTag '${{ inputs.release-tag }}'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Merge new package(s) into the repo database
      shell: msys2 {0}
      run: |
        set -euo pipefail
        cd "${{ inputs.package-dir }}"
        echo "::group::Contents of ${{ inputs.package-dir }} before repo-add"
        ls -la
        echo "::endgroup::"
        repo-add gnc-ucrt64.db.tar.zst *.pkg.tar.zst
        # repo-add normally symlinks the extensionless names to these; GitHub
        # Release assets don't reliably preserve symlinks, and pacman fetches
        # the repo by the extensionless name, so write real copies instead.
        cp -L gnc-ucrt64.db.tar.zst gnc-ucrt64.db
        cp -L gnc-ucrt64.files.tar.zst gnc-ucrt64.files
        echo "::group::Contents of ${{ inputs.package-dir }} after repo-add"
        ls -la
        echo "::endgroup::"

    - name: Upload new/updated assets
      shell: pwsh
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        $assets = Get-ChildItem -Path '${{ inputs.package-dir }}' -File | ForEach-Object { $_.FullName }
        Write-Host "Found $($assets.Count) file(s) to publish in '${{ inputs.package-dir }}':"
        $assets | ForEach-Object { Write-Host "  $_" }
        if ($assets.Count -eq 0) {
          Write-Error "No files found in '${{ inputs.package-dir }}' -- refusing to call gh with an empty file list, since gh release upload silently no-ops in that case instead of failing."
          exit 1
        }

        if ($env:UCRT64_RELEASE_NEEDS_CREATE -eq 'true') {
          # Create it with no assets yet, and publish it immediately, so its
          # tag is fully materialized before anything is ever uploaded.
          # --target is pinned to deps-repo's actual default branch rather
          # than left to auto-detect: without it, a newly created tag targets
          # whatever branch is set as default *at that moment*. If that ever
          # differs from the default branch later (e.g. it gets flipped back
          # after a temporary change), the tag is no longer reachable from
          # default-branch history, and GitHub's tag/release enforcement
          # eventually demotes the release back to an unpublished, untagged
          # state on its own -- with no error, hours after the fact.
          gh release create ${{ inputs.release-tag }} `
            -R ${{ inputs.deps-repo-owner }}/${{ inputs.deps-repo-name }} `
            --target ${{ inputs.target-branch }} `
            --title "GnuCash ucrt64 dependency repo" `
            --notes "Auto-generated rolling pacman repository for ucrt64. Do not edit manually; updated incrementally by workflows under .github/workflows/."
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gh release create failed (exit $LASTEXITCODE)."
            exit 1
          }
          gh release edit ${{ inputs.release-tag }} -R ${{ inputs.deps-repo-owner }}/${{ inputs.deps-repo-name }} --draft=false
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gh release edit --draft=false failed (exit $LASTEXITCODE)."
            exit 1
          }
        }

        gh release upload ${{ inputs.release-tag }} $assets -R ${{ inputs.deps-repo-owner }}/${{ inputs.deps-repo-name }} --clobber
        if ($LASTEXITCODE -ne 0) {
          Write-Error "gh release upload failed (exit $LASTEXITCODE)."
          exit 1
        }
