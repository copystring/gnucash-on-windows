name: gnucash-ucrt64-nightly
on:
    workflow_dispatch:
        inputs:
            gnucash_repository:
                description: GnuCash repository to build
                required: true
                default: gnucash/gnucash
                type: string
            gnucash_ref:
                description: GnuCash branch, tag, or commit to build
                required: true
                default: future
                type: string
            docs_repository:
                description: GnuCash documentation repository to build
                required: false
                default: gnucash/gnucash-docs
                type: string
            docs_ref:
                description: Documentation branch, tag, or commit; empty uses its default branch
                required: false
                default: ''
                type: string
            buildsupport_ref:
                description: Optional ref for inno_setup and extra_dist; empty preserves existing behavior
                required: false
                default: ''
                type: string
            gtk4_runtime_artifact_run_id:
                description: Optional successful GTK4 staging workflow run ID; requires gtk4_expected_recipe_sha
                required: false
                default: ''
                type: string
            gtk4_expected_recipe_sha:
                description: Expected gnucash-on-windows commit for the optional GTK4 staging artifact
                required: false
                default: ''
                type: string
            dependency_overlay_name:
                description: Optional Pacman repository name; requires dependency_overlay_url
                required: false
                default: ''
                type: string
            dependency_overlay_url:
                description: Optional Pacman repository URL; requires dependency_overlay_name
                required: false
                default: ''
                type: string
    workflow_call:
        inputs:
            gnucash_repository:
                description: GnuCash repository to build
                required: false
                default: gnucash/gnucash
                type: string
            gnucash_ref:
                description: GnuCash branch, tag, or commit to build
                required: false
                default: future
                type: string
            docs_repository:
                description: GnuCash documentation repository to build
                required: false
                default: gnucash/gnucash-docs
                type: string
            docs_ref:
                description: Documentation branch, tag, or commit; empty uses its default branch
                required: false
                default: ''
                type: string
            buildsupport_ref:
                description: Optional ref for inno_setup and extra_dist; empty preserves existing behavior
                required: false
                default: ''
                type: string
            gtk4_runtime_artifact_run_id:
                description: Optional successful GTK4 staging workflow run ID; requires gtk4_expected_recipe_sha
                required: false
                default: ''
                type: string
            gtk4_expected_recipe_sha:
                description: Expected gnucash-on-windows commit for the optional GTK4 staging artifact
                required: false
                default: ''
                type: string
            dependency_overlay_name:
                description: Optional Pacman repository name; requires dependency_overlay_url
                required: false
                default: ''
                type: string
            dependency_overlay_url:
                description: Optional Pacman repository URL; requires dependency_overlay_name
                required: false
                default: ''
                type: string
        outputs:
            artifact-url:
                description: Download URL of the uploaded nightly installer artifact
                value: ${{ jobs.gnucash_future_ucrt64_bundle.outputs.artifact-url }}
    schedule:
        - cron: '0 3 * * *'

permissions:
    actions: read
    contents: read
jobs:
    gnucash_future_ucrt64_bundle:
        runs-on: windows-latest
        name: Build GnuCash future branch Bundle
        outputs:
            artifact-url: ${{ steps.upload.outputs.artifact-url }}
        env:
          TZ: America/Los_Angeles
        defaults:
          run:
            shell: msys2 {0}
        steps:
        - name: Setup
          uses: msys2/setup-msys2@v2
          with:
            msystem: UCRT64
            update: true
            install: git
            pacboy: toolchain:p cmake:p ninja:p

        - name: Checkout packaging sources and workflow contracts
          uses: actions/checkout@v7
          with:
            ref: ${{ inputs.buildsupport_ref || (github.event_name == 'workflow_dispatch' && github.sha || 'future') }}
            sparse-checkout: |
                extra_dist
                inno_setup
                .github/workflows

        - name: Verify and download optional GTK4 staging artifact
          if: ${{ inputs.gtk4_runtime_artifact_run_id != '' || inputs.gtk4_expected_recipe_sha != '' }}
          shell: pwsh
          env:
            GH_TOKEN: ${{ github.token }}
            GTK4_RUN_ID: ${{ inputs.gtk4_runtime_artifact_run_id }}
            GTK4_EXPECTED_RECIPE_SHA: ${{ inputs.gtk4_expected_recipe_sha }}
          run: |
            $ErrorActionPreference = 'Stop'
            $repository = 'copystring/gnucash-on-windows'
            $artifact_name = 'ucrt64-gtk4-4.24.0-1.2-column-focus-ime'
            if ($Env:GTK4_RUN_ID -notmatch '^[1-9][0-9]*$') {
              throw 'gtk4_runtime_artifact_run_id must be a positive numeric Actions run ID.'
            }
            if ($Env:GTK4_EXPECTED_RECIPE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'gtk4_expected_recipe_sha must be a full 40-character commit SHA.'
            }
            $expected_sha = $Env:GTK4_EXPECTED_RECIPE_SHA.ToLowerInvariant()
            $run = gh api "repos/$repository/actions/runs/$Env:GTK4_RUN_ID" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read the requested GTK4 staging workflow run.' }
            if ([string]$run.id -cne $Env:GTK4_RUN_ID -or
                $run.repository.full_name -cne $repository -or
                $run.head_repository.full_name -cne $repository -or
                $run.head_sha -cne $expected_sha -or
                $run.head_branch -cne 'fix/owner-inspection-diagnostics-20260909' -or
                $run.path -cne '.github/workflows/build-ucrt64-gtk4.yml' -or
                $run.status -cne 'completed' -or
                $run.conclusion -cne 'success') {
              throw 'The requested GTK4 staging run does not match the reviewed repository, workflow, branch, commit, and successful conclusion.'
            }
            $artifacts = gh api "repos/$repository/actions/runs/$Env:GTK4_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to enumerate the requested GTK4 staging artifacts.' }
            $matching_artifacts = @($artifacts.artifacts | Where-Object {
                $_.name -ceq $artifact_name -and !$_.expired
            })
            if ($matching_artifacts.Count -ne 1) {
              throw "Expected exactly one non-expired '$artifact_name' artifact in the requested run."
            }
            $artifact_directory = Join-Path $Env:RUNNER_TEMP 'gtk4-staging-artifact'
            gh run download $Env:GTK4_RUN_ID --repo $repository --name $artifact_name --dir $artifact_directory
            if ($LASTEXITCODE -ne 0) { throw 'Unable to download the requested GTK4 staging artifact.' }
            # The producer uploads both repo-out and build logs. upload-artifact
            # therefore preserves repo-out below their common workspace root.
            $artifact_payload_directory = Join-Path $artifact_directory 'repo-out'
            $runtime_package = & .\inno_setup\validate-gtk4-staging-artifact.ps1 `
                -ArtifactDirectory $artifact_payload_directory -ExpectedRecipeCommit $expected_sha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $debug_package = Join-Path $artifact_payload_directory `
                'mingw-w64-gtk4-debug-4.24.0-1.2-any.pkg.tar.zst'
            "GTK4_STAGING_RUNTIME_PACKAGE=$runtime_package" | Add-Content $Env:GITHUB_ENV
            "GTK4_STAGING_DEBUG_PACKAGE=$debug_package" | Add-Content $Env:GITHUB_ENV
            'GTK4_STAGING_ENABLED=1' | Add-Content $Env:GITHUB_ENV

        - name: Add our repo
          shell: msys2 {0}
          env:
            DEPENDENCY_OVERLAY_NAME: ${{ inputs.dependency_overlay_name }}
            DEPENDENCY_OVERLAY_URL: ${{ inputs.dependency_overlay_url }}
          run: |
            set -euo pipefail
            sed -i "/^# SigLevel = Never/a [gnc-ucrt64]\nSigLevel = Optional TrustAll\nServer = https://github.com/Gnucash/gnucash-windows-deps-repo/releases/download/gnc-ucrt64-repo/" /etc/pacman.conf
            if [[ -n "$DEPENDENCY_OVERLAY_NAME" || -n "$DEPENDENCY_OVERLAY_URL" ]]; then
              if [[ -z "$DEPENDENCY_OVERLAY_NAME" || -z "$DEPENDENCY_OVERLAY_URL" ]]; then
                echo 'dependency_overlay_name and dependency_overlay_url must be provided together.' >&2
                exit 1
              fi
              if [[ ! "$DEPENDENCY_OVERLAY_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
                echo "Invalid dependency overlay name: $DEPENDENCY_OVERLAY_NAME" >&2
                exit 1
              fi
              dependency_overlay_url="${DEPENDENCY_OVERLAY_URL%/}/"
              if [[ ! "$dependency_overlay_url" =~ ^https://[A-Za-z0-9._/-]+/$ ]]; then
                echo "Invalid dependency overlay URL: $DEPENDENCY_OVERLAY_URL" >&2
                exit 1
              fi
              sed -i "/^# SigLevel = Never/a [$DEPENDENCY_OVERLAY_NAME]\nSigLevel = Optional TrustAll\nServer = $dependency_overlay_url" /etc/pacman.conf
            fi
            sed -i "s/^# ParallelDownloads/ParallelDownloads/" /etc/pacman.conf

            pacman -Syv
            packages=(swig:p appstream-glib:p aqbanking:p boost:p gtk4:p gsettings-desktop-schemas:p docbook-xsl:p gettext-tools:p gtest:p guile3:p harfbuzz-icu:p icu:p iso-codes:p pdcurses:p libdbi-drivers:p libofx:p libsecret:p webview2-loader:p zlib:p)
            if [[ "${GTK4_STAGING_ENABLED:-}" == 1 ]]; then
              packages+=(gdb:p)
            fi
            pacboy --noconfirm -S "${packages[@]}"

        - name: Install verified GTK4 staging runtime and debug symbols
          if: ${{ inputs.gtk4_runtime_artifact_run_id != '' }}
          shell: msys2 {0}
          run: |
            set -euo pipefail
            runtime_package=$(cygpath -u "$GTK4_STAGING_RUNTIME_PACKAGE")
            debug_package=$(cygpath -u "$GTK4_STAGING_DEBUG_PACKAGE")
            pacman --noconfirm -U "$runtime_package" "$debug_package"

        - name: Checkout GnuCash
          uses: actions/checkout@v7
          with:
            repository: ${{ inputs.gnucash_repository || 'gnucash/gnucash' }}
            ref: ${{ inputs.gnucash_ref || 'future' }}
            path: gnucash-git

        - name: Test GSettings schema preparation
          shell: pwsh
          run: |
            & .\inno_setup\tests\GSettingsSchemas.Tests.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\inno_setup\tests\Gtk3Payload.Tests.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\inno_setup\tests\InstallerArchitecture.Tests.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\inno_setup\tests\InstallerDiagnostics.Tests.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\inno_setup\tests\HtmlHelpWorkshop.Tests.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\inno_setup\tests\Gtk4StagingArtifact.Tests.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\inno_setup\tests\GApplicationIpc.Tests.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        - name: Build GApplication IPC runtime fixture
          shell: msys2 {0}
          run: |
            set -euo pipefail
            cc -Wall -Wextra -Werror \
              "$GITHUB_WORKSPACE/inno_setup/tests/gapplication-ipc-fixture.c" \
              $(pkg-config --cflags --libs gio-2.0) \
              -o "$RUNNER_TEMP/gapplication-ipc-fixture.exe"

        - name: Checkout GnuCash Docs
          uses: actions/checkout@v7
          with:
            repository: ${{ inputs.docs_repository || 'gnucash/gnucash-docs' }}
            ref: ${{ inputs.docs_ref || '' }}
            path: gnucash-docs-git

        - name: Prepare HTML Help Workshop
          shell: pwsh
          run: |
            $ErrorActionPreference = 'Stop'
            & .\inno_setup\prepare-html-help-workshop.ps1 `
                -OutputDirectory "$Env:RUNNER_TEMP\html-help-workshop"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        - name: Configure GnuCash
          shell: msys2 {0}
          env:
            GUILE_LOAD_PATH: "${{ env.MSYSTEM_PREFIX }}/share/guile/3.0/"
            GUILE_LOAD_COMPILED_PATH: "${{ env.MSYSTEM_PREFIX }}/lib/guile/3.0/ccache"
          run: |
            mkdir $RUNNER_TEMP/inst
            mkdir $RUNNER_TEMP/gnucash-build && cd $RUNNER_TEMP/gnucash-build
            cmake -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/inst" -DCMAKE_PREFIX_PATH=$MSYSTEM_PREFIX -DGNC_DBD_DIR=$MSYSTEM_PREFIX/lib/dbd -DWITH_AQBANKING=ON $GITHUB_WORKSPACE/gnucash-git

        - name: Build GnuCash
          env:
            GUILE_LOAD_PATH: "${{ env.MSYSTEM_PREFIX }}/share/guile/3.0/"
            GUILE_LOAD_COMPILED_PATH: "${{ env.MSYSTEM_PREFIX }}/lib/guile/3.0/ccache"
            GNC_DBD_DIR: "${{ env.MSYSTEM_PREFIX }}/lib/dbd"
          run: |
            set -euo pipefail
            cd $RUNNER_TEMP/gnucash-build
            ninja_args=()
            if [[ "${GTK4_STAGING_ENABLED:-}" == 1 ]]; then
              ninja_args=(-j 3)
            fi
            ninja "${ninja_args[@]}"
            ninja "${ninja_args[@]}" install

        - name: Run full Core check with verified GTK4 staging package
          id: gtk4_staging_core_check
          if: ${{ inputs.gtk4_runtime_artifact_run_id != '' }}
          timeout-minutes: 45
          env:
            GUILE_LOAD_PATH: "${{ env.MSYSTEM_PREFIX }}/share/guile/3.0/"
            GUILE_LOAD_COMPILED_PATH: "${{ env.MSYSTEM_PREFIX }}/lib/guile/3.0/ccache"
            GNC_DBD_DIR: "${{ env.MSYSTEM_PREFIX }}/lib/dbd"
            CTEST_OUTPUT_ON_FAILURE: '1'
          run: |
            set -euo pipefail
            cd $RUNNER_TEMP/gnucash-build
            ninja -j 3 check

        - name: Capture native matcher IME backtrace after a Core test failure
          if: ${{ failure() && steps.gtk4_staging_core_check.outcome == 'failure' }}
          timeout-minutes: 4
          env:
            GUILE_LOAD_PATH: "${{ env.MSYSTEM_PREFIX }}/share/guile/3.0/"
            GUILE_LOAD_COMPILED_PATH: "${{ env.MSYSTEM_PREFIX }}/lib/guile/3.0/ccache"
            GNC_DBD_DIR: "${{ env.MSYSTEM_PREFIX }}/lib/dbd"
          run: |
            bash "$GITHUB_WORKSPACE/gnucash-git/util/ci/windows-matcher-ime-backtrace.sh" \
              "$RUNNER_TEMP/gnucash-build"

        - name: Upload GTK4 staging Core diagnostics
          if: ${{ always() && inputs.gtk4_runtime_artifact_run_id != '' }}
          uses: actions/upload-artifact@v7
          with:
            name: gtk4-staging-core-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
            path: |
              ${{ runner.temp }}/gnucash-build/Testing/Temporary/LastTest.log
              ${{ runner.temp }}/gnucash-build/matcher-ime-backtrace.log
              ${{ runner.temp }}/gtk4-staging-artifact/repo-out/manifest.json
              ${{ runner.temp }}/gtk4-staging-artifact/repo-out/SHA256SUMS
            if-no-files-found: ignore

        - name: Configure GnuCash Docs
          shell: msys2 {0}
          run: |
            mkdir $RUNNER_TEMP/gnucash-docs-build && cd $RUNNER_TEMP/gnucash-docs-build
            cmake -G Ninja -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/inst" -DHHC="$RUNNER_TEMP/html-help-workshop/hhc.exe" $GITHUB_WORKSPACE/gnucash-docs-git

        - name: Build GnuCash Docs
          run: |
            set -euo pipefail
            cd $RUNNER_TEMP/gnucash-docs-build
            ninja_args=()
            if [[ "${GTK4_STAGING_ENABLED:-}" == 1 ]]; then
              ninja_args=(-j 3)
            fi
            ninja "${ninja_args[@]}"
            ninja "${ninja_args[@]}" install

        - name: Copy message catalogs
          shell: msys2 {0}
          run: |
            for dir in "$MSYSTEM_PREFIX"/share/locale/* ; do
              [ -d "$dir" ] || continue
              export lang=$(basename "$dir")
              for msgcat in gtk40.mo iso_4217.mo aqbanking.mo gwenhywfar.mo ; do
                if [ -f "$dir/LC_MESSAGES/$msgcat" ]; then
                  [ -d "$RUNNER_TEMP/inst/share/locale/$lang/LC_MESSAGES" ] || mkdir -p "$RUNNER_TEMP/inst/share/locale/$lang/LC_MESSAGES"
                  cp "$dir/LC_MESSAGES/$msgcat" "$RUNNER_TEMP/inst/share/locale/$lang/LC_MESSAGES"
                fi
              done
            done

        - name: Prepare GSettings schemas
          shell: pwsh
          run: |
            $msys_prefix = (msys2 -c 'cygpath -w $MSYSTEM_PREFIX').trim()
            & .\inno_setup\prepare-gsettings-schemas.ps1 `
                -SourceDirectory "$msys_prefix\share\glib-2.0\schemas" `
                -TargetDirectory "$Env:RUNNER_TEMP\inst\share\glib-2.0\schemas" `
                -CompilerPath "$msys_prefix\bin\glib-compile-schemas.exe" `
                -GSettingsPath "$msys_prefix\bin\gsettings.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        - name: Configure gnucash.iss
          shell: pwsh
          run: |
            $gnc_config_h = "$Env:RUNNER_TEMP\gnucash-build\common\config.h"

            function version_item([string]$tag, [string]$path) {
               $splits = select-string -pattern $tag -path $path | %{$_ -split "\s+"}
                  $splits[2]
            }
            $major_version = version_item -tag "PROJECT_VERSION_MAJOR" -path $gnc_config_h
            $minor_version = version_item -tag "PROJECT_VERSION_MINOR" -path $gnc_config_h
            $package_version = "$major_version.$minor_version"
            "PACKAGE_VERSION=$package_version" | Add-Content $Env:GITHUB_ENV
            $msys_prefix = (msys2 -c 'cygpath -w $MSYSTEM_PREFIX').trim()
            $guile_output = & "$msys_prefix\bin\guile.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "Unable to query Guile version (exit code $LASTEXITCODE)." }
            $guile_match = [regex]::Match(($guile_output -join "`n"), '(?m)^guile \(GNU Guile\) (\d+\.\d+)')
            if (!$guile_match.Success) { throw "Unable to parse Guile major.minor version: $($guile_output -join ' ')" }

            $content = Get-Content -Raw -Path inno_setup\gnucash-mingw64.iss
            $content = $content.replace("@MINGW_DIR@", "$msys_prefix")
            $content = $content.replace("@INST_DIR@", "$Env:RUNNER_TEMP\inst")
            $content = $content.replace("@PACKAGE_VERSION@", "$package_version")
            $content = $content.replace("@PACKAGE@", "gnucash")
            $content = $content.replace("@GNUCASH_MAJOR_VERSION@", "$major_version")
            $content = $content.replace("@GNUCASH_MINOR_VERSION@", "$minor_version")
            $content = $content.replace("@GUILE_VERSION@", "$($guile_match.Groups[1].Value)")
            $content = $content.replace("@GC_WIN_REPOS_DIR@", ".")
            if ($content -match '@[A-Z_]+@') { throw "Unresolved Inno template token: $($matches[0])" }
            set-content -Path gnucash.iss -Value $content -Encoding utf8BOM

        - name: Package GnuCash
          uses: Minionguyjpro/Inno-setup-Action@v1.2.9
          with:
            path: gnucash.iss
            options: /Q

        - name: Verify optional Inno source fixtures
          shell: pwsh
          run: |
            $ErrorActionPreference = 'Stop'
            & .\inno_setup\tests\Gtk3Payload.Tests.ps1 `
                -InnoCompiler "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\inno_setup\tests\InstallerArchitecture.Tests.ps1 `
                -InnoCompiler "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
                -RunInstallerFixtures
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        - name: Rename the setup file
          shell: pwsh
          run: |
            function version_item([string]$tag, [string]$path) {
               $splits = select-string -pattern $tag -path $path | %{$_ -split "\s+"}
                  $splits[2]
            }
            $gnc_vcsinfo_h = "$Env:RUNNER_TEMP\gnucash-build\libgnucash\core-utils\gnc-vcs-info.h"
            $vcs_rev = version_item -tag "GNC_VCS_REV" -path $gnc_vcsinfo_h | %{$_ -replace """", ""}
            $date = version_item -tag "GNC_VCS_REV_DATE" -path $gnc_vcsinfo_h | %{$_ -replace """", ""}
            $final_name = "gnucash-$date-$vcs_rev.setup.exe"
            rename-item -path "gnucash-$Env:PACKAGE_VERSION.setup.exe" "$final_name"
            "FINAL_NAME=$final_name" | Add-Content $Env:GITHUB_ENV

        - name: Verify GTK4 installer preflight
          timeout-minutes: 10
          shell: pwsh
          run: |
            $ErrorActionPreference = 'Stop'
            $msys_prefix = (msys2 -c 'cygpath -w $MSYSTEM_PREFIX').trim()
            & .\inno_setup\verify-installer.ps1 `
                -InstallerPath ".\$Env:FINAL_NAME" `
                -GApplicationFixturePath "$Env:RUNNER_TEMP\gapplication-ipc-fixture.exe" `
                -GSettingsPath "$msys_prefix\bin\gsettings.exe" `
                -DiagnosticsDirectory "$Env:RUNNER_TEMP\installer-preflight-diagnostics"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        - name: Upload installer preflight diagnostics
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: installer-preflight-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
            path: ${{ runner.temp }}/installer-preflight-diagnostics
            if-no-files-found: ignore

        - name: Upload nightly build
          id: upload
          uses: actions/upload-artifact@v7
          with:
            archive: false
            overwrite: true
            name: ${{ env.FINAL_NAME }}
            path: ${{ env.FINAL_NAME }}
