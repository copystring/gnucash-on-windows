name: Build ucrt64 AqBanking group

# Builds gwenhywfar, libchipcard, and aqbanking (in that dependency order)
# for ucrt64, then merges them into the shared gnc-ucrt64-repo rolling
# release without disturbing packages published by the other build-ucrt64-*
# workflows. This group changes rarely (roughly once a year), so there's no
# schedule trigger -- run it manually or push a change under packages/.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [packages]
    paths:
      - 'packages/gwenhywfar/**'
      - 'packages/libchipcard/**'
      - 'packages/aqbanking/**'
      - '.github/workflows/build-ucrt64-aqbanking.yml'
      - '.github/actions/publish-ucrt64-repo/**'
  schedule:
    - cron: '0 4 * * 3'
env:
  MINGW_ARCH: ucrt64

permissions:
  contents: write

concurrency:
  group: gnc-ucrt64-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'future' || github.sha }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            pacman-contrib
            autoconf
            automake
            libtool
            mingw-w64-ucrt-x86_64-toolchain

      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Build and install packages in dependency order
        run: |
          set -euo pipefail
          mkdir -p repo-out
          repo_out="$(pwd)/repo-out"
          for pkg in gwenhywfar libchipcard aqbanking; do
            echo "::group::Building $pkg"
            pushd "packages/$pkg"
            makepkg-mingw -sCf --noconfirm --nocheck
            for f in mingw-w64-ucrt-x86_64-*.pkg.tar.zst; do
              pacman -U --noconfirm "$f"
              cp "$f" "$repo_out/"
            done
            popd
            echo "::endgroup::"
          done

      - name: Upload built packages
        uses: actions/upload-artifact@v7
        with:
          name: ucrt64-aqbanking-packages
          path: repo-out/*.pkg.tar.zst
          if-no-files-found: error

      - name: Publish to rolling ucrt64 repo
        if: vars.DEPS_REPO_APP_CLIENT_ID != ''
        uses: ./.github/actions/publish-ucrt64-repo
        with:
          package-dir: repo-out
          app-client-id: ${{ vars.DEPS_REPO_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DEPS_REPO_APP_PRIVATE_KEY }}
