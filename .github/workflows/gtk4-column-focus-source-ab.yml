name: GTK4 ColumnView source A/B

on:
  push:
    branches:
      - fix/gtk4-ime-reproducer-20260912
    paths:
      - .github/workflows/gtk4-column-focus-source-ab.yml
      - tests/gtk4-column-focus-ownership-probe/**
      - tests/gtk4-popover-ownership-probe/main.c
      - tests/gtk4-popover-ownership-probe/CMakeLists.txt
      - tests/gtk4-source-diagnostics/**
      - tests/gnucash-gtk4-focused/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtk4-column-focus-source-ab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-ab:
    if: >-
      github.repository == 'copystring/gnucash-on-windows' &&
      github.ref == 'refs/heads/fix/gtk4-ime-reproducer-20260912'
    name: GTK 4.22.4 source (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The pinned baseline already has a complete trace in run 34730055220.
        # Manual A/B runs retain both variants; follow-up pushes test fixes only.
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["baseline","patched"]' || '["patched"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests/gtk4-column-focus-ownership-probe
            tests/gtk4-popover-ownership-probe
            tests/gtk4-source-diagnostics
            tests/gnucash-gtk4-focused
          sparse-checkout-cone-mode: true

      - name: Install GTK source-build and probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            at-spi2-core \
            binutils \
            cmake \
            dbus-x11 \
            file \
            gdb \
            git \
            libglib2.0-dev \
            libgtk-4-dev \
            libcairo2-dev \
            libdrm-dev \
            libepoxy-dev \
            libfontconfig-dev \
            libfribidi-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libpng-dev \
            libtiff-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            meson \
            ninja-build \
            pkg-config \
            sassc \
            wayland-protocols \
            xauth \
            xvfb

      - name: Build GTK source and run the ownership probe
        shell: bash
        env:
          NINJA_JOBS: '3'
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tests/gtk4-column-focus-ownership-probe/run-source-ab.sh" \
            "${{ matrix.variant }}"

      - name: Trace retained Popover reference against fresh baseline GTK
        if: ${{ matrix.variant == 'baseline' }}
        shell: bash
        env:
          NINJA_JOBS: '3'
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tests/gtk4-source-diagnostics/run-popover-reftrace.sh" \
            "$RUNNER_TEMP/gtk-column-focus-source-baseline/gtk-build" \
            "$RUNNER_TEMP/gtk-column-focus-source-baseline-diagnostics"

      - name: Check out the focused GnuCash candidate
        if: ${{ matrix.variant == 'patched' }}
        uses: actions/checkout@v7
        with:
          repository: copystring/gnucash
          ref: ba3cff738d8005605658baefc6b00b2c27328016
          path: gnucash-core

      - name: Verify the three Popover lifecycle paths with patched GTK
        if: ${{ matrix.variant == 'patched' }}
        run: |
          bash "$GITHUB_WORKSPACE/tests/gtk4-source-diagnostics/run-popover-regressions.sh" \
            "$RUNNER_TEMP/gtk-column-focus-source-patched/gtk-build" \
            "$RUNNER_TEMP/gtk-column-focus-source-patched-diagnostics"

      - name: Install GnuCash test dependencies
        if: ${{ matrix.variant == 'patched' }}
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends \
            gettext libxslt1-dev xsltproc libboost-all-dev guile-2.2-dev \
            libofx-dev libdbi-dev libdbd-sqlite3 libwebkitgtk-6.0-dev \
            googletest python3-dev swig language-pack-en language-pack-fr

      - name: Run the six affected GnuCash tests with patched GTK
        if: ${{ matrix.variant == 'patched' }}
        env:
          NINJA_JOBS: '3'
          TZ: America/Los_Angeles
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tests/gnucash-gtk4-focused/run-focused-core.sh" \
            "$GITHUB_WORKSPACE/gnucash-core" \
            "$RUNNER_TEMP/gtk-column-focus-source-patched/gtk-build" \
            "$RUNNER_TEMP/gtk-column-focus-source-patched-diagnostics"

      - name: Preserve source-build and probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gtk4-column-focus-source-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gtk-column-focus-source-${{ matrix.variant }}-diagnostics
          if-no-files-found: error
          retention-days: 14
