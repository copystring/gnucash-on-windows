name: Test package repository publication

on:
  push:
    paths:
      - '.github/actions/publish-ucrt64-repo/**'
      - 'bundle-mingw64.ps1'
      - 'inno_setup/**'
      - 'setup-mingw64.sh'
      - '.github/workflows/gnucash-ucrt64-nightly.yml'
      - '.github/workflows/package-repository-tests.yml'
  pull_request:
    paths:
      - '.github/actions/publish-ucrt64-repo/**'
      - 'bundle-mingw64.ps1'
      - 'inno_setup/**'
      - 'setup-mingw64.sh'
      - '.github/workflows/gnucash-ucrt64-nightly.yml'
      - '.github/workflows/package-repository-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test repository download and publication gates
        shell: pwsh
        run: |
          & ./.github/actions/publish-ucrt64-repo/tests/fetch-ucrt64-repo-assets.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test GSettings schema preparation
        shell: pwsh
        run: |
          & ./inno_setup/tests/GSettingsSchemas.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./inno_setup/tests/Gtk3Payload.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./inno_setup/tests/InstallerArchitecture.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installer diagnostic error preservation
        shell: pwsh
        run: |
          & ./inno_setup/tests/InstallerDiagnostics.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup for source fixtures
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test optional Inno source fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./inno_setup/tests/Gtk3Payload.Tests.ps1 `
            -InnoCompiler "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./inno_setup/tests/InstallerArchitecture.Tests.ps1 `
            -InnoCompiler "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            -RunInstallerFixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
