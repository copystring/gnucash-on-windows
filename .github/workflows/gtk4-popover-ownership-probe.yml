name: GTK4 popover ownership probe

on:
    push:
        branches: [fix/gtk4-ime-reproducer-20260912]
        paths:
            - .github/workflows/gtk4-popover-ownership-probe.yml
            - tests/gtk4-popover-ownership-probe/**
    workflow_dispatch:
        inputs:
            expected_gtk4_package_version:
                description: Expected UCRT64 GTK4 package version
                required: true
                default: 4.24.0-1
                type: string
            expected_glib2_package_version:
                description: Expected UCRT64 GLib package version
                required: true
                default: 2.90.0-1
                type: string

permissions:
    contents: read

concurrency:
    group: gtk4-popover-ownership-probe-${{ github.ref }}
    cancel-in-progress: false

jobs:
    windows_ucrt64:
        name: Probe UCRT64 popover ownership
        if: github.repository == 'copystring/gnucash-on-windows'
        runs-on: windows-latest
        timeout-minutes: 10
        defaults:
            run:
                shell: pwsh
        steps:
        - name: Set up isolated UCRT64 GTK4 toolchain
          uses: msys2/setup-msys2@v2
          with:
            msystem: UCRT64
            update: true
            pacboy: toolchain:p cmake:p ninja:p gtk4:p

        - name: Check out probe source
          uses: actions/checkout@v7
          with:
            sparse-checkout: |
                tests/gtk4-popover-ownership-probe

        - name: Verify UCRT64 GTK4 package contract
          shell: msys2 {0}
          env:
            EXPECTED_GTK4_PACKAGE_VERSION: ${{ inputs.expected_gtk4_package_version || '4.24.0-1' }}
            EXPECTED_GLIB2_PACKAGE_VERSION: ${{ inputs.expected_glib2_package_version || '2.90.0-1' }}
          run: |
            set -euo pipefail
            diagnostics="$(cygpath -u "$RUNNER_TEMP")/gtk-popover-probe-diagnostics"
            mkdir -p "$diagnostics"

            gtk_package='mingw-w64-ucrt-x86_64-gtk4'
            glib_package='mingw-w64-ucrt-x86_64-glib2'
            gtk_version="$(pacman -Q "$gtk_package" | awk '{ print $2 }')"
            glib_version="$(pacman -Q "$glib_package" | awk '{ print $2 }')"
            gtk_api_version="$(pkg-config --modversion gtk4)"
            glib_api_version="$(pkg-config --modversion glib-2.0)"

            {
              printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
              printf 'RUNNER_ARCH=%s\n' "$RUNNER_ARCH"
              printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
              printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
              printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
              printf 'MSYSTEM=%s\n' "$MSYSTEM"
              printf 'MINGW_PACKAGE_PREFIX=%s\n' "$MINGW_PACKAGE_PREFIX"
              printf 'uname_machine=%s\n' "$(uname -m)"
              printf '%s=%s\n' "$gtk_package" "$gtk_version"
              printf '%s=%s\n' "$glib_package" "$glib_version"
              printf 'expected_gtk4_package_version=%s\n' \
                "$EXPECTED_GTK4_PACKAGE_VERSION"
              printf 'expected_glib2_package_version=%s\n' \
                "$EXPECTED_GLIB2_PACKAGE_VERSION"
              printf 'gtk4_pkg_config=%s\n' "$gtk_api_version"
              printf 'glib2_pkg_config=%s\n' "$glib_api_version"
              printf 'gtk4_prefix=%s\n' "$(pkg-config --variable=prefix gtk4)"
              printf 'cc=%s\n' "$(cc --version | head -n 1)"
              printf 'cmake=%s\n' "$(cmake --version | head -n 1)"
              printf 'ninja=%s\n' "$(ninja --version)"
            } | tee "$diagnostics/environment.txt"

            [[ "$RUNNER_OS" == 'Windows' ]]
            [[ "$RUNNER_ARCH" == 'X64' ]]
            [[ "$MSYSTEM" == 'UCRT64' ]]
            [[ "$MINGW_PACKAGE_PREFIX" == 'mingw-w64-ucrt-x86_64' ]]
            [[ "$(uname -m)" == 'x86_64' ]]
            [[ "$gtk_version" == "$EXPECTED_GTK4_PACKAGE_VERSION" ]]
            [[ "$glib_version" == "$EXPECTED_GLIB2_PACKAGE_VERSION" ]]
            [[ "$gtk_api_version" == "${EXPECTED_GTK4_PACKAGE_VERSION%-*}" ]]
            [[ "$glib_api_version" == "${EXPECTED_GLIB2_PACKAGE_VERSION%-*}" ]]

            if pacman -Q mingw-w64-ucrt-x86_64-gtk3 >/dev/null 2>&1; then
              echo 'Unexpected UCRT64 GTK3 package is installed.' >&2
              exit 1
            fi
            if pkg-config --exists gtk+-3.0; then
              echo 'Unexpected GTK3 pkg-config module is visible.' >&2
              exit 1
            fi
            printf 'ucrt64_gtk3_package=absent\ngtk3_pkg_config=absent\n' |
              tee "$diagnostics/gtk3-exclusion.txt"

        - name: Build isolated probe and verify imports
          shell: msys2 {0}
          run: |
            set -euo pipefail
            source_dir="$(cygpath -u "$GITHUB_WORKSPACE")/tests/gtk4-popover-ownership-probe"
            build_dir="$(cygpath -u "$RUNNER_TEMP")/gtk-popover-probe-build"
            diagnostics="$(cygpath -u "$RUNNER_TEMP")/gtk-popover-probe-diagnostics"

            {
              cmake -S "$source_dir" -B "$build_dir" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build "$build_dir" --verbose
            } 2>&1 | tee "$diagnostics/build.txt"

            executable="$build_dir/gtk-popover-ownership-probe.exe"
            test -x "$executable"
            objdump -f "$executable" | tee "$diagnostics/executable-architecture.txt"
            objdump -p "$executable" |
              sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p' |
              tee "$diagnostics/imported-dlls.txt"
            grep -q 'architecture: i386:x86-64' \
              "$diagnostics/executable-architecture.txt"
            grep -Eqi '^libgtk-4-[0-9]+\.dll$' "$diagnostics/imported-dlls.txt"
            if grep -Eqi '^libgtk-3-[0-9]+\.dll$' "$diagnostics/imported-dlls.txt"; then
              echo 'Built executable unexpectedly imports GTK3.' >&2
              exit 1
            fi

        - name: Run all popover ownership modes
          run: |
            $ErrorActionPreference = 'Stop'
            $diagnostics = Join-Path $Env:RUNNER_TEMP 'gtk-popover-probe-diagnostics'
            $executable = Join-Path $Env:RUNNER_TEMP `
                'gtk-popover-probe-build\gtk-popover-ownership-probe.exe'
            $ucrtPrefixOutput = msys2 -c 'cygpath -w $MSYSTEM_PREFIX'
            if ($LASTEXITCODE -ne 0) {
                throw "Cannot resolve the UCRT64 runtime prefix: exit $LASTEXITCODE"
            }
            $ucrtPrefix = ($ucrtPrefixOutput -join "`n").Trim()
            if (!(Test-Path -LiteralPath (Join-Path $ucrtPrefix 'bin') -PathType Container)) {
                throw 'The resolved UCRT64 runtime prefix has no bin directory.'
            }
            $Env:PATH = @(
                (Join-Path $ucrtPrefix 'bin')
                (Join-Path $Env:SystemRoot 'System32')
                $Env:SystemRoot
            ) -join [IO.Path]::PathSeparator

            function Invoke-ProbeMode {
                param(
                    [Parameter(Mandatory)] [string] $Name,
                    [Parameter(Mandatory)] [AllowEmptyCollection()] [string[]] $Arguments
                )

                $stdout = Join-Path $diagnostics "$Name.stdout.txt"
                $stderr = Join-Path $diagnostics "$Name.stderr.txt"
                $startedAt = [DateTimeOffset]::UtcNow
                $timedOut = $false
                $startParameters = @{
                    FilePath = $executable
                    WindowStyle = 'Hidden'
                    PassThru = $true
                    RedirectStandardError = $stderr
                    RedirectStandardOutput = $stdout
                }
                if ($Arguments.Count -gt 0) {
                    $startParameters.ArgumentList = $Arguments
                }

                try {
                    $process = Start-Process @startParameters
                    if (!$process.WaitForExit(15000)) {
                        $timedOut = $true
                        $process.Kill($true)
                        $process.WaitForExit()
                    }
                    $exitCode = $process.ExitCode
                    $exitCodeBytes = [BitConverter]::GetBytes([int32] $exitCode)
                    $exitCodeUnsigned = [BitConverter]::ToUInt32($exitCodeBytes, 0)
                    $exitCodeHex = '0x{0:X8}' -f $exitCodeUnsigned
                    $startError = $null
                }
                catch {
                    $exitCode = $null
                    $exitCodeHex = $null
                    $startError = $_.Exception.ToString()
                    $startError | Set-Content -LiteralPath $stderr -Encoding utf8
                    if (!(Test-Path -LiteralPath $stdout)) {
                        New-Item -ItemType File -Path $stdout | Out-Null
                    }
                }

                $record = [pscustomobject] [ordered] @{
                    mode = $Name
                    arguments = $Arguments
                    startedAtUtc = $startedAt.ToString('o')
                    endedAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
                    exitCode = $exitCode
                    exitCodeHex = $exitCodeHex
                    timedOut = $timedOut
                    startError = $startError
                }
                $record | ConvertTo-Json -Depth 4 |
                    Set-Content -LiteralPath (Join-Path $diagnostics "$Name.json") `
                        -Encoding utf8

                Write-Host "--- $Name stdout ---"
                Get-Content -LiteralPath $stdout | ForEach-Object { Write-Host $_ }
                Write-Host "--- $Name stderr ---"
                Get-Content -LiteralPath $stderr | ForEach-Object { Write-Host $_ }
                Write-Host "$Name native exit: $exitCode ($exitCodeHex)"
                return $record
            }

            $results = @(
                Invoke-ProbeMode -Name 'retained-normal-close' -Arguments @()
                Invoke-ProbeMode -Name 'owner-release' -Arguments @('--owner-release')
                Invoke-ProbeMode -Name 'retained-replacement' -Arguments @('--replacement')
            )
            $results | ConvertTo-Json -Depth 4 |
                Set-Content -LiteralPath (Join-Path $diagnostics 'summary.json') `
                    -Encoding utf8
            $failures = @($results | Where-Object {
                $_.timedOut -or $null -eq $_.exitCode -or $_.exitCode -ne 0
            })
            if ($failures.Count -ne 0) {
                $failedModes = ($failures | ForEach-Object {
                    "$($_.mode)=$($_.exitCode) ($($_.exitCodeHex)), " +
                    "timedOut=$($_.timedOut)"
                }) -join ', '
                throw "GTK popover ownership probe failure: $failedModes"
            }

        - name: Upload complete Windows diagnostics
          if: ${{ always() }}
          uses: actions/upload-artifact@v7
          with:
            name: gtk4-popover-probe-windows-${{ github.run_id }}-${{ github.run_attempt }}
            path: ${{ runner.temp }}/gtk-popover-probe-diagnostics
            if-no-files-found: error
            compression-level: 6

    linux_xvfb:
        name: Probe Ubuntu 26.04 popover ownership
        if: github.repository == 'copystring/gnucash-on-windows'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
        - name: Check out probe source
          uses: actions/checkout@v7
          with:
            sparse-checkout: |
                tests/gtk4-popover-ownership-probe

        - name: Install isolated GTK4 build and Xvfb dependencies
          run: |
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              build-essential cmake file gdb libgtk-4-dev ninja-build pkg-config \
              xauth xvfb

        - name: Verify Ubuntu GTK4 environment
          run: |
            set -euo pipefail
            diagnostics="$RUNNER_TEMP/gtk-popover-probe-diagnostics"
            mkdir -p "$diagnostics"
            . /etc/os-release
            gtk_api_version="$(pkg-config --modversion gtk4)"
            glib_api_version="$(pkg-config --modversion glib-2.0)"

            {
              printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
              printf 'RUNNER_ARCH=%s\n' "$RUNNER_ARCH"
              printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
              printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
              printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
              printf 'distribution=%s\n' "$ID"
              printf 'distribution_version=%s\n' "$VERSION_ID"
              printf 'uname_machine=%s\n' "$(uname -m)"
              printf 'gtk4_pkg_config=%s\n' "$gtk_api_version"
              printf 'glib2_pkg_config=%s\n' "$glib_api_version"
              printf 'gtk4_libdir=%s\n' "$(pkg-config --variable=libdir gtk4)"
              dpkg-query -W -f='libgtk-4-dev=${Version}\n' libgtk-4-dev
              dpkg-query -W -f='libglib2.0-dev=${Version}\n' libglib2.0-dev
              printf 'cc=%s\n' "$(cc --version | head -n 1)"
              printf 'cmake=%s\n' "$(cmake --version | head -n 1)"
              printf 'ninja=%s\n' "$(ninja --version)"
            } | tee "$diagnostics/environment.txt"

            [[ "$RUNNER_OS" == 'Linux' ]]
            [[ "$RUNNER_ARCH" == 'X64' ]]
            [[ "$ID" == 'ubuntu' ]]
            [[ "$VERSION_ID" == '26.04' ]]
            [[ "$(uname -m)" == 'x86_64' ]]
            [[ "$gtk_api_version" == 4.* ]]

        - name: Build isolated probe and verify shared objects
          run: |
            set -euo pipefail
            source_dir="$GITHUB_WORKSPACE/tests/gtk4-popover-ownership-probe"
            build_dir="$RUNNER_TEMP/gtk-popover-probe-build"
            diagnostics="$RUNNER_TEMP/gtk-popover-probe-diagnostics"

            {
              cmake -S "$source_dir" -B "$build_dir" -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
              cmake --build "$build_dir" --verbose
            } 2>&1 | tee "$diagnostics/build.txt"

            executable="$build_dir/gtk-popover-ownership-probe"
            test -x "$executable"
            file "$executable" | tee "$diagnostics/executable-architecture.txt"
            ldd "$executable" | tee "$diagnostics/imported-shared-objects.txt"
            grep -Eq 'ELF 64-bit.*x86-64' "$diagnostics/executable-architecture.txt"
            grep -Eq 'libgtk-4\.so' "$diagnostics/imported-shared-objects.txt"
            if grep -Eq 'libgtk-3\.so' "$diagnostics/imported-shared-objects.txt"; then
              echo 'Built executable unexpectedly links GTK3.' >&2
              exit 1
            fi

        - name: Run all popover ownership modes under Xvfb
          env:
            GDK_BACKEND: x11
            LIBGL_ALWAYS_SOFTWARE: '1'
          run: |
            set -euo pipefail
            diagnostics="$RUNNER_TEMP/gtk-popover-probe-diagnostics"
            executable="$RUNNER_TEMP/gtk-popover-probe-build/gtk-popover-ownership-probe"
            failures=()

            run_mode()
            {
              local name="$1"
              shift
              local stdout="$diagnostics/$name.stdout.txt"
              local stderr="$diagnostics/$name.stderr.txt"
              local exit_code
              local timed_out=false

              set +e
              timeout --signal=KILL --kill-after=2s 15s \
                xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
                "$executable" "$@" >"$stdout" 2>"$stderr"
              exit_code=$?
              set -e
              if [[ "$exit_code" -eq 124 || "$exit_code" -eq 137 ]]; then
                timed_out=true
              fi

              {
                printf 'mode=%s\n' "$name"
                printf 'arguments=%s\n' "$*"
                printf 'exit_code=%s\n' "$exit_code"
                printf 'timed_out=%s\n' "$timed_out"
              } | tee "$diagnostics/$name.exit.txt"
              printf '%s\n' "--- $name stdout ---"
              cat "$stdout"
              printf '%s\n' "--- $name stderr ---"
              cat "$stderr"
              printf '%s native exit: %s\n' "$name" "$exit_code"

              if [[ "$exit_code" -ne 0 ]]; then
                failures+=("$name=$exit_code,timedOut=$timed_out")
              fi
            }

            run_mode retained-normal-close
            run_mode owner-release --owner-release
            run_mode retained-replacement --replacement
            printf '%s\n' "${failures[@]}" >"$diagnostics/failures.txt"
            if [[ "${#failures[@]}" -ne 0 ]]; then
              printf 'GTK popover ownership probe failures: %s\n' \
                "${failures[*]}" >&2
              exit 1
            fi

        - name: Trace the retained Linux Popover reference with GDB
          if: ${{ always() }}
          env:
            GDK_BACKEND: x11
            LIBGL_ALWAYS_SOFTWARE: '1'
          run: |
            set -euo pipefail
            diagnostics="$RUNNER_TEMP/gtk-popover-probe-diagnostics"
            executable="$RUNNER_TEMP/gtk-popover-probe-build/gtk-popover-ownership-probe"
            gdb_commands="$diagnostics/retained-normal-close-refcount.gdb"
            gdb_stdout="$diagnostics/retained-normal-close-gdb.stdout.txt"
            gdb_stderr="$diagnostics/retained-normal-close-gdb.stderr.txt"
            gdb_exit="$diagnostics/retained-normal-close-gdb.exit.txt"

            test -x "$executable"
            command -v gdb
            cat >"$gdb_commands" <<'GDB'
            set pagination off
            set confirm off
            set debuginfod enabled off
            set breakpoint pending off
            set can-use-hw-watchpoints 1
            break gtk_popover_probe_refcount_marker
            run
            set $watched_popover = object
            printf "POPOVER_GDB_MARKER object=%p ref_count=%u\n", $watched_popover, ((GObject *) $watched_popover)->ref_count
            watch -location ((GObject *) $watched_popover)->ref_count
            commands
              printf "POPOVER_REFCOUNT_TRANSITION object=%p ref_count=%u\n", $watched_popover, ((GObject *) $watched_popover)->ref_count
              bt 12
              continue
            end
            continue
            GDB

            set +e
            timeout --signal=KILL --kill-after=2s 120s \
              xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
              gdb --batch --return-child-result --command="$gdb_commands" \
                --args "$executable" >"$gdb_stdout" 2>"$gdb_stderr"
            gdb_status=$?
            set -e

            {
              printf 'mode=retained-normal-close\n'
              printf 'gdb_exit_code=%s\n' "$gdb_status"
            } | tee "$gdb_exit"
            cat "$gdb_stdout"
            cat "$gdb_stderr"

            if [[ "$gdb_status" -eq 124 || "$gdb_status" -eq 137 ]]; then
              printf 'GDB retained-normal-close trace timed out.\n' >&2
              exit 1
            fi
            if [[ "$gdb_status" -ne 1 ]]; then
              printf 'GDB trace did not preserve the retained-normal-close failure: exit=%s\n' \
                "$gdb_status" >&2
              exit 1
            fi
            grep -q 'Hardware watchpoint' "$gdb_stdout"
            grep -q 'POPOVER_GDB_MARKER object=' "$gdb_stdout"
            grep -q 'POPOVER_REFCOUNT_TRANSITION object=' "$gdb_stdout"
            # Exit 1 alone also covers setup/watchdog failures and is insufficient.
            grep -q 'popover still alive after test-ref release' "$gdb_stderr"
            if grep -q 'No required after-paint boundary' "$gdb_stderr"; then
              printf 'Probe watchdog expired under GDB; no ownership diagnosis.\n' >&2
              exit 1
            fi

        - name: Upload complete Linux diagnostics
          if: ${{ always() }}
          uses: actions/upload-artifact@v7
          with:
            name: gtk4-popover-probe-linux-${{ github.run_id }}-${{ github.run_attempt }}
            path: ${{ runner.temp }}/gtk-popover-probe-diagnostics
            if-no-files-found: error
            compression-level: 6
