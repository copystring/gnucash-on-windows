name: Build ucrt64 libofx group

# Builds OpenSP and libofx (in that dependency order) for ucrt64, then
# merges them into the shared gnc-ucrt64-repo rolling release without
# disturbing packages published by the other build-ucrt64-* workflows.

on:
  workflow_dispatch:
  push:
    branches: [packages]
    paths:
      - 'packages/OpenSP/**'
      - 'packages/libofx/**'
      - '.github/workflows/build-ucrt64-libofx.yml'
      - '.github/actions/publish-ucrt64-repo/**'

env:
  MINGW_ARCH: ucrt64

permissions:
  contents: write

concurrency:
  group: gnc-ucrt64-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            pacman-contrib
            automake
            autoconf
            libtool
            mingw-w64-ucrt-x86_64-toolchain

      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Build and install packages in dependency order
        run: |
          set -euo pipefail
          mkdir -p repo-out
          repo_out="$(pwd)/repo-out"
          for pkg in OpenSP libofx; do
            echo "::group::Building $pkg"
            pushd "packages/$pkg"
            makepkg-mingw -sCf --noconfirm --nocheck
            for f in mingw-w64-ucrt-x86_64-*.pkg.tar.zst; do
              pacman -U --noconfirm "$f"
              cp "$f" "$repo_out/"
            done
            popd
            echo "::endgroup::"
          done

      - name: Publish to rolling ucrt64 repo
        uses: ./.github/actions/publish-ucrt64-repo
        with:
          package-dir: repo-out
