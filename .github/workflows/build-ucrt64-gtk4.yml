name: Build temporary ucrt64 gtk4 staging package

on:
  workflow_dispatch:
  push:
    branches:
      - fix/owner-inspection-diagnostics-20260909
    paths:
      - packages/gtk4/**
      - .github/workflows/build-ucrt64-gtk4.yml

env:
  MINGW_ARCH: ucrt64

permissions:
  contents: read

concurrency:
  group: ucrt64-gtk4-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'copystring/gnucash-on-windows' &&
      github.ref == 'refs/heads/fix/owner-inspection-diagnostics-20260909'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - name: Initialize artifact diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path repo-out | Out-Null
          @(
            "repository=$env:GITHUB_REPOSITORY"
            "sha=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
          ) | Set-Content -LiteralPath repo-out/RUN-CONTEXT.txt -Encoding utf8NoBOM

      # setup-msys2 handles the runtime upgrade that terminates MSYS2 shells.
      # A shell-level retry cannot survive that required process shutdown.
      - uses: msys2/setup-msys2@v2
        timeout-minutes: 15
        with:
          msystem: UCRT64
          update: true

      - name: Configure bounded Pacman downloads
        run: |
          set -euo pipefail
          sed -i 's/^#\s*ParallelDownloads.*/ParallelDownloads = 5/' /etc/pacman.conf

      - name: Install the official recipe dependencies with bounded retries
        run: |
          set -euo pipefail
          exec > >(tee -a repo-out/pacman-dependencies.log) 2>&1

          pacman_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Pacman dependency attempt ${attempt}/3"
              if timeout --foreground 20m pacman "$@"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep 15
              fi
            done
            return 1
          }

          # The runtime upgrade has completed in setup-msys2. Install exactly
          # the official PKGBUILD dependency sets in this new process.
          cd packages/gtk4
          source ./PKGBUILD
          pacman_retry -S --needed --noconfirm \
            base-devel git \
            "${makedepends[@]}" "${depends[@]}"

      - name: Verify pinned sources with bounded download retries
        run: |
          set -euo pipefail
          exec > >(tee -a repo-out/source-verification.log) 2>&1
          cd packages/gtk4

          test "$(sha256sum gtkcolumnview-focus-column-ref.patch | cut -d' ' -f1)" = \
            '23046af144974f7a91d6a2cdad14f9de6764a667077bbb9dc6fd1a0611b3d5f9'
          test "$(sha256sum 001-fix-font-rendering.patch | cut -d' ' -f1)" = \
            'ebac78616a7668edbfdd77b9959ad63239aa59ed12b995a9663bf2df7158be26'

          for attempt in 1 2 3; do
            echo "GTK source-download attempt ${attempt}/3"
            if timeout --foreground 15m makepkg-mingw --verifysource --noconfirm; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 15
            fi
          done
          echo 'GTK source verification failed after three bounded attempts.' >&2
          exit 1

      - name: Run IME lifetime fixture against the official GTK baseline
        run: |
          set -euo pipefail
          exec > >(tee -a repo-out/ime-baseline.log) 2>&1
          repo_out="$(pwd)/repo-out"
          cd packages/gtk4

          pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gtk4
          baseline_version="$(pacman -Q mingw-w64-ucrt-x86_64-gtk4 | awk '{print $2}')"
          test "${baseline_version}" = '4.24.0-1'
          echo "official_runtime_package=${baseline_version}"

          cc -std=c11 -Wall -Wextra -Werror \
            test-ime-filter-lifetime.c \
            -o "${repo_out}/test-ime-filter-lifetime-baseline.exe" \
            $(pkg-config --cflags --libs gtk4) -limm32

          run_case() {
            local path="$1"
            local expected="$2"
            local log="${repo_out}/ime-baseline-${path##*/}.log"
            local status=0
            MSYS2_ARG_CONV_EXCL='/ime/' timeout --foreground 30s \
              "${repo_out}/test-ime-filter-lifetime-baseline.exe" -p "${path}" \
              >"${log}" 2>&1 || status=$?
            echo "${path}: exit=${status} expected=${expected}"
            loaded_dll="$(tr -d '\r' < "${log}" | sed -n 's/^# loaded_gtk_dll=//p' | tail -n 1)"
            expected_dll="$(cygpath -w /ucrt64/bin/libgtk-4-1.dll)"
            test "${loaded_dll,,}" = "${expected_dll,,}"
            if [[ "${expected}" == pass ]]; then
              test "${status}" -eq 0
              tr -d '\r' < "${log}" | grep -Fxq '1..1'
              tr -d '\r' < "${log}" | grep -Fxq "ok 1 ${path}"
            else
              test "${status}" -ne 0
              test "${status}" -ne 124
              if [[ "${path}" == /ime/filter/release-during-filter ]]; then
                if ! grep -Fq 'release_context_on_preedit_start' "${log}"; then
                  cat "${log}" >&2
                  return 1
                fi
              else
                grep -Fq "not ok ${path} - " "${log}"
                grep -Eq 'GTK_IS_IM_CONTEXT_IME' "${log}"
              fi
            fi
          }

          run_case /ime/filter/normal pass
          run_case /ime/filter/repeated-focus pass
          run_case /ime/filter/reentrant-focus pass
          run_case /ime/filter/detached-client fail
          run_case /ime/filter/dispose-focused fail
          run_case /ime/filter/release-during-filter fail

      - name: Build GTK 4.24.0 with ColumnView and IME ownership patches
        run: |
          set -euo pipefail
          exec > >(tee -a repo-out/package-build.log) 2>&1
          repo_out="$(pwd)/repo-out"
          cd packages/gtk4
          makepkg-mingw -CLf --noconfirm

          grep -Fq 'g_clear_object (&item);' src/gtk-4.24.0/gtk/gtkcolumnview.c

          shopt -s nullglob
          main_packages=(mingw-w64-ucrt-x86_64-gtk4-4.24.0-1.2-*.pkg.tar.zst)
          debug_packages=(mingw-w64-gtk4-debug-4.24.0-1.2-*.pkg.tar.zst)
          (( ${#main_packages[@]} == 1 ))
          (( ${#debug_packages[@]} == 1 ))

          runtime_metadata=$(bsdtar -xOf "${main_packages[0]}" .PKGINFO)
          grep -Fxq 'pkgname = mingw-w64-ucrt-x86_64-gtk4' <<< "$runtime_metadata"
          grep -Fxq 'pkgbase = mingw-w64-gtk4' <<< "$runtime_metadata"
          grep -Fxq 'pkgver = 4.24.0-1.2' <<< "$runtime_metadata"
          grep -Fxq 'arch = any' <<< "$runtime_metadata"

          debug_metadata=$(bsdtar -xOf "${debug_packages[0]}" .PKGINFO)
          grep -Fxq 'pkgname = mingw-w64-gtk4-debug' <<< "$debug_metadata"
          grep -Fxq 'pkgbase = mingw-w64-gtk4' <<< "$debug_metadata"
          grep -Fxq 'pkgver = 4.24.0-1.2' <<< "$debug_metadata"
          grep -Fxq 'arch = any' <<< "$debug_metadata"
          debug_contents=$(bsdtar -tf "${debug_packages[0]}")
          grep -Fxq 'ucrt64/bin/libgtk-4-1.dll.debug' <<< "$debug_contents"
          if grep -Eq '^(mingw32|mingw64|clang64|clangarm64)/' <<< "$debug_contents"; then
            echo 'Debug package contains symbols for an unexpected MSYS2 environment.' >&2
            exit 1
          fi
          cp "${main_packages[@]}" "${debug_packages[@]}" "$repo_out/"

      - name: Install and run the patched IME lifetime fixture
        run: |
          set -euo pipefail
          exec > >(tee -a repo-out/ime-patched.log) 2>&1
          repo_out="$(pwd)/repo-out"
          cd packages/gtk4
          shopt -s nullglob
          main_packages=(mingw-w64-ucrt-x86_64-gtk4-4.24.0-1.2-*.pkg.tar.zst)
          debug_packages=(mingw-w64-gtk4-debug-4.24.0-1.2-*.pkg.tar.zst)
          (( ${#main_packages[@]} == 1 ))
          (( ${#debug_packages[@]} == 1 ))

          pacman -U --noconfirm "${main_packages[0]}" "${debug_packages[0]}"
          patched_version="$(pacman -Q mingw-w64-ucrt-x86_64-gtk4 | awk '{print $2}')"
          debug_version="$(pacman -Q mingw-w64-gtk4-debug | awk '{print $2}')"
          test "${patched_version}" = '4.24.0-1.2'
          test "${debug_version}" = '4.24.0-1.2'
          echo "patched_runtime_package=${patched_version}"
          echo "patched_debug_package=${debug_version}"
          pacman -Qo /ucrt64/bin/libgtk-4-1.dll
          pacman -Ql mingw-w64-ucrt-x86_64-gtk4 | grep -F ' /ucrt64/bin/libgtk-4-1.dll'

          cc -std=c11 -Wall -Wextra -Werror \
            test-ime-filter-lifetime.c \
            -o "${repo_out}/test-ime-filter-lifetime-patched.exe" \
            $(pkg-config --cflags --libs gtk4) -limm32
          timeout --foreground 30s \
            "${repo_out}/test-ime-filter-lifetime-patched.exe" \
            >"${repo_out}/ime-patched-all-tests.log" 2>&1
          grep -Fq '1..6' "${repo_out}/ime-patched-all-tests.log"
          test "$(grep -Ec '^ok [0-9]+ /ime/filter/' "${repo_out}/ime-patched-all-tests.log")" -eq 6
          loaded_dll="$(tr -d '\r' < "${repo_out}/ime-patched-all-tests.log" | sed -n 's/^# loaded_gtk_dll=//p' | tail -n 1)"
          expected_dll="$(cygpath -w /ucrt64/bin/libgtk-4-1.dll)"
          test -n "${loaded_dll}"
          test "$(printf '%s' "${loaded_dll}" | tr '[:upper:]' '[:lower:]')" = \
            "$(printf '%s' "${expected_dll}" | tr '[:upper:]' '[:lower:]')"
          echo "loaded_gtk_dll_sha256=$(sha256sum /ucrt64/bin/libgtk-4-1.dll | cut -d' ' -f1)"

      - name: Record package provenance and hashes
        run: |
          set -euo pipefail
          exec > >(tee -a repo-out/package-provenance.log) 2>&1
          {
            echo "Staging recipe commit: $GITHUB_SHA"
            echo "PKGBUILD SHA-256: $(sha256sum packages/gtk4/PKGBUILD | cut -d' ' -f1)"
            echo 'MSYS2 MINGW-packages recipe commit: de381e6b410070c15e84a3fa40fa53962057d7c7'
            echo 'GTK tag commit: 1f47f368b17701e693918fcd078436b39d4354d1'
            echo 'Official reference recipe commit: 62ef6f178fb03342b647f8172efb324bfe48a520'
            echo 'GTK source SHA-256: 28ba4ac1c04f86eac09b79a163cb163a4c2b54442d9f7eccc04679062a581044'
            echo 'ColumnView patch SHA-256: 23046af144974f7a91d6a2cdad14f9de6764a667077bbb9dc6fd1a0611b3d5f9'
            echo 'IME lifetime patch SHA-256: 19fb2395b11a178e6057de2e961970e405bce8539665fa79fb99b0b4feb38693'
            echo "IME lifetime fixture SHA-256: $(sha256sum packages/gtk4/test-ime-filter-lifetime.c | cut -d' ' -f1)"
            echo
            pacman --version
            cc --version
            echo
            for package in repo-out/*.pkg.tar.zst; do
              pacman -Qip "$package"
            done
          } > repo-out/BUILD-PROVENANCE.txt
          (cd repo-out && sha256sum *.pkg.tar.zst > SHA256SUMS)

      - name: Write machine-readable handoff manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = 'ucrt64-gtk4-4.24.0-1.2-column-focus-ime'
          $packages = @(Get-ChildItem -LiteralPath repo-out -Filter '*.pkg.tar.zst' -File |
            Sort-Object Name |
            ForEach-Object {
              [ordered]@{
                name = $_.Name
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                kind = if ($_.Name -match '-gtk4-debug-') { 'debug' } else { 'runtime' }
              }
            })
          if (@($packages | Where-Object kind -eq 'runtime').Count -ne 1) {
            throw 'Expected exactly one GTK runtime package.'
          }
          if (@($packages | Where-Object kind -eq 'debug').Count -ne 1) {
            throw 'Expected exactly one GTK debug package.'
          }
          $manifest = [ordered]@{
            schemaVersion = 1
            artifactName = $artifactName
            stagingRecipeCommit = $env:GITHUB_SHA
            pkgbuildSha256 = (Get-FileHash -LiteralPath packages/gtk4/PKGBUILD -Algorithm SHA256).Hash.ToLowerInvariant()
            packageVersion = '4.24.0-1.2'
            architecture = 'ucrt64'
            recipe = [ordered]@{
              repository = 'https://github.com/msys2/MINGW-packages'
              commit = 'de381e6b410070c15e84a3fa40fa53962057d7c7'
              referenceCommit = '62ef6f178fb03342b647f8172efb324bfe48a520'
            }
            source = [ordered]@{
              url = 'https://download.gnome.org/sources/gtk/4.24/gtk-4.24.0.tar.xz'
              sha256 = '28ba4ac1c04f86eac09b79a163cb163a4c2b54442d9f7eccc04679062a581044'
              tagCommit = '1f47f368b17701e693918fcd078436b39d4354d1'
            }
            patches = @(
              [ordered]@{
                name = '001-fix-font-rendering.patch'
                sha256 = 'ebac78616a7668edbfdd77b9959ad63239aa59ed12b995a9663bf2df7158be26'
                origin = 'msys2'
              },
              [ordered]@{
                name = 'gtkcolumnview-focus-column-ref.patch'
                sha256 = '23046af144974f7a91d6a2cdad14f9de6764a667077bbb9dc6fd1a0611b3d5f9'
                origin = 'temporary-gnucash-staging'
              },
              [ordered]@{
                name = 'gtkimcontextime-filter-lifetime.patch'
                sha256 = '19fb2395b11a178e6057de2e961970e405bce8539665fa79fb99b0b4feb38693'
                origin = 'temporary-gnucash-staging'
              }
            )
            regressionFixture = [ordered]@{
              name = 'test-ime-filter-lifetime.c'
              sha256 = (Get-FileHash -LiteralPath packages/gtk4/test-ime-filter-lifetime.c -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            packages = $packages
          }
          $manifest | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath repo-out/manifest.json -Encoding utf8NoBOM

      - name: Upload GTK packages or failure diagnostics without publishing a feed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ucrt64-gtk4-4.24.0-1.2-column-focus-ime
          path: |
            repo-out/*.pkg.tar.zst
            repo-out/*.log
            repo-out/RUN-CONTEXT.txt
            repo-out/BUILD-PROVENANCE.txt
            repo-out/SHA256SUMS
            repo-out/manifest.json
            repo-out/ime-*.log
            repo-out/test-ime-filter-lifetime-*.exe
            packages/gtk4/*.log
            packages/gtk4/src/build-UCRT64/meson-logs/**
          if-no-files-found: error
          retention-days: 14
